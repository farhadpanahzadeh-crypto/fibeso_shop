<body class="page-checkout chrome-checkout">
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>

  <header class="checkout-header">
    <div class="container">
      <div class="checkout-header__box">
        <a class="brand" href="../index.html" aria-label="فروشگاه فیبسو، صفحه اصلی">
          <img class="brand__mark" src="../assets/images/logo-mark.svg" alt="" width="40" height="40">
          <span>فیبسو</span>
        </a>
      </div>
    </div>
  </header>

  <main id="main" class="co-page">
    <div class="container">
      <div data-checkout>
        <noscript><p class="empty-state">برای تکمیل سفارش، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>
      </div>
    </div>

    <dialog class="dialog co-dialog" aria-labelledby="addr-add-title" data-dialog="add">
      <form class="co-dialog__form" novalidate data-address-form>
        <div class="dialog__head co-dialog__head">
          <h2 class="dialog__title" id="addr-add-title">افزودن آدرس</h2>
          <button class="co-dialog__close" type="button" data-dialog-close aria-label="بستن"><svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>
        </div>
        <div class="dialog__body co-dialog__body">
          <p class="co-dialog__lead">موقعیت تقریبی و نشانی کامل گیرنده را وارد کنید.</p>
          <div class="co-map" role="img" aria-label="پیش‌نمایش نقشه (غیرفعال)">
            <span class="co-map__pin"><svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M128,64a40,40,0,1,0,40,40A40,40,0,0,0,128,64Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,128Zm0-112a88.1,88.1,0,0,0-88,88c0,31.4,14.51,64.68,42,96.25a254.19,254.19,0,0,0,41.45,38.3,8,8,0,0,0,9.18,0A254.19,254.19,0,0,0,174,200.25c27.45-31.57,42-64.85,42-96.25A88.1,88.1,0,0,0,128,16Zm0,206c-16.53-13-72-60.75-72-118a72,72,0,0,1,144,0C200,161.23,144.53,209,128,222Z"/></svg></span>
            <span class="co-map__text">انتخاب موقعیت روی نقشه به‌زودی فعال می‌شود. فعلاً نشانی را دقیق بنویسید.</span>
          </div>
          <div data-address-fields></div>
          <label class="check co-dialog__default"><input type="checkbox" name="isDefault" checked> <span>این آدرس، آدرس پیش‌فرض من باشد</span></label>
        </div>
        <div class="dialog__foot co-dialog__foot">
          <button class="btn btn--primary btn--block" type="submit">تایید و ثبت آدرس</button>
        </div>
      </form>
    </dialog>

    <dialog class="dialog co-dialog" aria-labelledby="addr-pick-title" data-dialog="pick">
      <form class="co-dialog__form" novalidate data-pick-form>
        <div class="dialog__head co-dialog__head">
          <h2 class="dialog__title" id="addr-pick-title">انتخاب آدرس</h2>
          <button class="co-dialog__close" type="button" data-dialog-close aria-label="بستن"><svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>
        </div>
        <div class="dialog__body co-dialog__body">
          <fieldset class="co-fieldset">
            <legend class="visually-hidden">آدرس‌های ذخیره‌شده</legend>
            <div class="choice-list" data-pick-list></div>
          </fieldset>
          <button class="co-add-link" type="button" data-open-add><svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z"/></svg> افزودن آدرس جدید</button>
        </div>
        <div class="dialog__foot co-dialog__foot">
          <button class="btn btn--primary btn--block" type="submit">ارسال به این آدرس</button>
        </div>
      </form>
    </dialog>
  </main>

  <footer class="mini-footer">
    <div class="container">
      <p>© ۱۴۰۵ فروشگاه فیبسو · <a href="../pages/terms.html">قوانین و مقررات</a> · <a href="../pages/contact.html">تماس با ما</a></p>
    </div>
  </footer>
</body>
</html>
