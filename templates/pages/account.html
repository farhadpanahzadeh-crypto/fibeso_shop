<!-- {"out": "pages/account.html", "title": "پنل کاربری | فیبسو", "description": "پنل کاربری فیبسو: سفارش‌ها، علاقه‌مندی‌ها، آدرس‌ها و اطلاعات حساب.", "noindex": true, "css": ["pages/account.css"], "js": ["pages/account.js"]} -->
  <main id="main" class="page-section">
    <div class="container account">
      <aside class="account__side" aria-label="منوی پنل کاربری">
        <div class="account__user">
          <span class="account__avatar" aria-hidden="true" data-user-initial></span>
          <div>
            <p class="account__name" data-user-name></p>
            <p class="account__mobile ltr" data-user-mobile></p>
          </div>
        </div>
        <nav class="account__nav" aria-label="بخش‌های پنل">
          <a class="account__link" href="#dashboard" data-section-link="dashboard">
            {{icon:layout}}
            پیشخوان
          </a>
          <a class="account__link" href="#orders" data-section-link="orders">
            {{icon:package}}
            سفارش‌ها
          </a>
          <a class="account__link" href="#wishlist" data-section-link="wishlist">
            {{icon:heart}}
            علاقه‌مندی‌ها
          </a>
          <a class="account__link" href="#addresses" data-section-link="addresses">
            {{icon:map-pin}}
            آدرس‌ها
          </a>
          <a class="account__link" href="#profile" data-section-link="profile">
            {{icon:user}}
            اطلاعات حساب
          </a>
          <button class="account__link account__logout" type="button" data-logout>
            {{icon:sign-out}}
            خروج از حساب
          </button>
        </nav>
      </aside>

      <div class="account__main">
        <section class="account__section" id="dashboard" aria-labelledby="dashboard-title" data-section>
          <h1 class="account__title" id="dashboard-title" tabindex="-1">پیشخوان</h1>
          <div data-dashboard></div>
        </section>
        <section class="account__section" id="orders" aria-labelledby="orders-title" data-section hidden>
          <h1 class="account__title" id="orders-title" tabindex="-1">سفارش‌های من</h1>
          <div class="tabs-line" role="tablist" aria-label="وضعیت سفارش" data-order-tabs>
            <button class="tabs-line__tab" role="tab" type="button" aria-selected="true" data-status="">همه</button>
            <button class="tabs-line__tab" role="tab" type="button" aria-selected="false" tabindex="-1" data-status="processing">در حال پردازش</button>
            <button class="tabs-line__tab" role="tab" type="button" aria-selected="false" tabindex="-1" data-status="shipped">ارسال‌شده</button>
            <button class="tabs-line__tab" role="tab" type="button" aria-selected="false" tabindex="-1" data-status="delivered">تحویل‌شده</button>
          </div>
          <div class="order-list" role="tabpanel" aria-label="فهرست سفارش‌ها" data-orders></div>
        </section>
        <section class="account__section" id="wishlist" aria-labelledby="wishlist-title" data-section hidden>
          <h1 class="account__title" id="wishlist-title" tabindex="-1">علاقه‌مندی‌ها</h1>
          <ul class="product-grid account__grid" data-wishlist></ul>
        </section>
        <section class="account__section" id="addresses" aria-labelledby="addresses-title" data-section hidden>
          <div class="panel__head">
            <h1 class="account__title" id="addresses-title" tabindex="-1">آدرس‌ها</h1>
            <button class="btn btn--primary btn--sm" type="button" data-address-add>افزودن آدرس جدید</button>
          </div>
          <ul class="address-list" data-addresses></ul>
        </section>
        <section class="account__section" id="profile" aria-labelledby="profile-title" data-section hidden>
          <h1 class="account__title" id="profile-title" tabindex="-1">اطلاعات حساب</h1>
          <form class="panel" novalidate data-profile-form></form>
        </section>
      </div>
    </div>

    <dialog class="dialog" aria-labelledby="address-dialog-title" data-address-dialog>
      <form novalidate data-address-form>
        <div class="dialog__head">
          <h2 class="dialog__title" id="address-dialog-title">آدرس جدید</h2>
          <button class="icon-btn" type="button" aria-label="بستن" data-dialog-close>
            {{icon:x}}
          </button>
        </div>
        <div class="dialog__body" data-address-fields></div>
        <div class="dialog__foot">
          <button class="btn btn--primary" type="submit">ذخیره آدرس</button>
          <button class="btn btn--outline" type="button" data-dialog-close>انصراف</button>
        </div>
      </form>
    </dialog>
  </main>
