<!-- {"out": "pages/cart.html", "title": "سبد خرید | فیبسو", "description": "مشاهده و ویرایش سبد خرید در فروشگاه فیبسو.", "noindex": true, "css": ["pages/cart.css"], "js": ["pages/cart.js"], "tab": "cart"} -->
  <main id="main" class="cart-page">
    <div class="container">
      <div data-cart-page>
        <noscript><p class="empty-state">برای مشاهده سبد خرید، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>
      </div>

      <section class="cart-recent" aria-labelledby="recent-title" data-recent hidden>
        <div class="rail">
          <div class="rail__head">
            <h2 class="rail__title" id="recent-title">آخرین کالاهای دیده شده</h2>
            <div class="rail__tools">
              <div class="scroller__controls">
                <button class="round-btn" type="button" data-scroll-prev="recent" aria-label="کالاهای قبلی">{{icon:caret-right}}</button>
                <button class="round-btn" type="button" data-scroll-next="recent" aria-label="کالاهای بعدی">{{icon:caret-left}}</button>
              </div>
            </div>
          </div>
          <div class="scroller" data-scroller="recent">
            <ul class="scroller__track" aria-labelledby="recent-title" data-recent-track></ul>
          </div>
        </div>
      </section>
    </div>

    <dialog class="dialog confirm-dialog" aria-labelledby="clear-title" aria-describedby="clear-text" data-clear-dialog>
      <form method="dialog">
        <div class="dialog__body confirm-dialog__body">
          <span class="confirm-dialog__icon">{{icon:trash}}</span>
          <h2 class="dialog__title" id="clear-title">همه کالاها از سبد حذف شوند؟</h2>
          <p class="text-muted" id="clear-text">با این کار تمام کالاهای سبد خرید شما حذف می‌شود و قابل بازگشت نیست.</p>
        </div>
        <div class="dialog__foot confirm-dialog__foot">
          <button class="btn btn--outline" type="submit" value="cancel" autofocus>انصراف</button>
          <button class="btn btn--danger" type="submit" value="confirm">بله، حذف شود</button>
        </div>
      </form>
    </dialog>
  </main>
